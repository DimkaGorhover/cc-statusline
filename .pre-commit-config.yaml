# Uses prek-only features (`repo: builtin`, `groups`); upstream `pre-commit` cannot run this file.
#
# Groups: `modify` = hooks that rewrite files, `validate` = read-only checks.
# In CI run them in order so validation sees formatted files:
#   prek run --all-files --group modify && prek run --all-files --group validate
minimum_prek_version: "0.4.11"

default_stages:
  - pre-commit

repos:
  - repo: meta # validates this file: flags hooks that match nothing and excludes that exclude nothing
    hooks:
      - id: check-hooks-apply
        groups:
          - validate
      - id: check-useless-excludes
        groups:
          - validate

  - repo: local
    hooks:
      - id: ruff-format
        groups:
          - modify
          - python
        name: Ruff Format
        language: system
        entry: ruff
        args:
          - format
        types:
          - python

      - id: ruff-check
        groups:
          - modify
          - python
        name: Ruff Check
        language: system
        entry: ruff
        args:
          - check
          - --fix
        types:
          - python

  - repo: builtin
    hooks:
      - id: trailing-whitespace
        groups:
          - modify
      - id: check-added-large-files
        groups:
          - validate
      - id: check-case-conflict
        groups:
          - validate
      - id: mixed-line-ending
        groups:
          - modify
        args:
          - --fix=lf # Enforce Linux/macOS style (LF)
      - id: end-of-file-fixer
        groups:
          - modify
      - id: check-toml
        groups:
          - validate
      - id: detect-private-key
        groups:
          - validate
      - id: check-merge-conflict
        groups:
          - validate
      - id: check-executables-have-shebangs
        groups:
          - validate

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: forbid-submodules
        groups:
          - validate

  - repo: local
    hooks:
      # https://github.com/gitleaks/gitleaks/blob/master/.pre-commit-hooks.yaml
      - id: gitleaks
        groups:
          - validate
        pass_filenames: false
        name: Detect hardcoded secrets
        description: Detect hardcoded secrets using Gitleaks
        entry: gitleaks
        args:
          - git
          - --pre-commit
          - --redact
          - --no-banner
          - --staged
          - --verbose
          - --max-target-megabytes=10
        language: system

      - id: pytest
        groups:
          - validate
          - python
        name: pytest
        language: system
        entry: uv run --quiet --frozen pytest -q -p no:cacheprovider
        pass_filenames: false
        files: ^(statusline\.py|tests/.*\.py|pyproject\.toml|uv\.lock)$

      # the README promises Python 3.9 (macOS /usr/bin/python3); pytest needs a newer one,
      # so render a sample input on 3.9 to catch newer-than-3.9 library calls
      - id: py39-smoke
        groups:
          - validate
          - python
        name: render on Python 3.9
        language: system
        entry: sh -c 'uv run --quiet --no-project --python 3.9 python statusline.py render < tests/input.json > /dev/null'
        pass_filenames: false
        files: ^(statusline\.py|tests/input\.json)$

      - id: ty
        groups:
          - validate
          - python
        name: ty
        language: system
        # the project venv gives ty pytest and the Python version
        entry: uv run --quiet --frozen ty check
        pass_filenames: false
        types:
          - python
