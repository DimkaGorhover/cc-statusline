[project]
name = "cc-statusline"
version = "0.2.1"
description = "Two-line Claude Code status line: model, context, git/worktree, rate limits"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
cc-statusline = "statusline:main"

[project.urls]
Repository = "https://github.com/DimkaGorhover/cc-statusline"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# a single module, not a package; uv_build only builds package folders
only-include = ["statusline.py"]

[dependency-groups]
dev = [
    # pytest 9 needs 3.10+; the 3.9 runtime is covered by the py39-smoke pre-commit hook
    "pytest>=9.2.0; python_version >= '3.10'",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
