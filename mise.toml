#:schema https://mise.en.dev/schema/mise.json
[settings]
minimum_release_age = "7d"

[tools]
gitleaks = "latest"
prek = "latest"
python = "3.9"
ruff = "latest"
ty = "latest"
uv = "latest"

[tasks.pre-commit]
description = "run pre-commit hooks on all files"
run = "prek run --all-files --cd {{config_root}}"

[tasks.test]
description = "run tests"
dir = "{{config_root}}"
run = "uv run --quiet --frozen pytest"

[tasks.smoke-py39]
description = "render a sample input on Python 3.9"
dir = "{{config_root}}"
run = "uv run --quiet --no-project --python 3.9 python statusline.py render < tests/input.json > /dev/null"
